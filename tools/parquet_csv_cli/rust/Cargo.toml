[package]
name = "parquet_csv_cli"
version = "0.2.0"
edition = "2024"
[dependencies]
parquet = {version = "=60.1.0", default-features = false, features = ["arrow", "snap", "zstd"]}
arrow-array = "=60.1.0"
arrow-schema = "=60.1.0"
ryu = "=1.0.23"
serde_json = "=1.0.145"
chrono = {version = "=0.4.45", default-features = false, features = ["std"]}
serde = "=1.0.229"
libc = "=0.2.191"
[[bin]]
name = "parquet_csv_cli"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
