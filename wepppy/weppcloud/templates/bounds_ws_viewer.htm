<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Bounds Watershed Viewer </title>
    <!-- Style Sheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" type="image/x-icon">
    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" type="image/x-icon">
    <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script type="text/javascript">
const collection = {{ collection | tojson }};
const site_prefix = collection.sitePrefix;

async function fetchJson(url) {
    const response = await fetch(url, { credentials: 'same-origin' });
    const text = await response.text();
    if (!response.ok) {
        throw new Error(`Request failed (${response.status})`);
    }
    if (!text) {
        return null;
    }
    try {
        return JSON.parse(text);
    } catch (err) {
        throw new Error('Invalid JSON response');
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    let center;
    let zoom;
    let ws;
    let title;

    const map = L.map('map');

    const googleTerrain = L.tileLayer("https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}", {
      maxZoom: 20,
      subdomains: ["mt0", "mt1", "mt2", "mt3"]
    });

    const googleSat = L.tileLayer("https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", {
      maxZoom: 20,
      subdomains: ["mt0", "mt1", "mt2", "mt3"]
    });

    const baseMaps = {
      "Satellite": googleSat,
      "Terrain": googleTerrain
    };

    const overlayMaps = {};

    googleSat.addTo(map);
    googleTerrain.addTo(map);

    const ctrls = L.control.layers(baseMaps, overlayMaps);
    ctrls.addTo(map);

    let defaultStyle;

    let TitleBox;

    let polys;
    let data;
    let popup;

    ({center, zoom, ws, title} = collection);
    await callback();

    async function callback() {
        if (!center || zoom === undefined) {
            return;
        }
        map.setView(center, zoom);

        defaultStyle = {
            "color": "#ff7800",
            "weight": 2,
            "opacity": 0.65,
            "fillColor": "#ff7800",
            "fillOpacity": 0.3
        };

        TitleBox = L.Control.extend({
            options: {
                position: 'bottomright'
            },
            initialize: function (options) {
                // constructor
            },
            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');

                container.style.backgroundColor = 'transparent';
                container.style.borderColor = 'transparent';
                container.style.width = '500px';
                container.style.height = '40px';

                const heading = document.createElement('h4');
                heading.textContent = title;
                container.append(heading);
                return container;
            },
            onRemove: function (map) {
                // when removed
            }
        });

        polys = {};
        data = undefined;
        popup = undefined;

        if (Array.isArray(ws)) {
            const tasks = ws.map(async (w) => {
                const runid = w.runid;
                const cfg = w.cfg;
                polys[runid] = {};

                try {
                    const response = await fetchJson(`${site_prefix}/runs/${encodeURIComponent(runid)}/${encodeURIComponent(cfg)}/resources/bound.json`);
                    if (!response || !response.features || !response.features.length) {
                        throw new Error('Missing bound geometry');
                    }

                    polys[runid] = L.geoJSON(response.features[0], {
                        style: defaultStyle,
                        onEachFeature: function (feature, layer) {
                            layer.on({
                                click: function click(ev) {
                                    if (popup !== undefined) {
                                        popup.remove();
                                    }
                                    const content = document.createElement('div');
                                    const heading = document.createElement('h5');
                                    heading.textContent = runid;
                                    const link = document.createElement('a');
                                    link.textContent = 'View Watershed Run';
                                    link.href = `${site_prefix}/runs/${encodeURIComponent(runid)}/${encodeURIComponent(cfg)}/`;
                                    content.append(heading, link);

                                    popup = L.popup()
                                        .setLatLng(ev.latlng)
                                        .setContent(content)
                                        .openOn(map);
                                }
                            });
                        }
                    });

                    polys[runid].name = response.name;
                    polys[runid].addTo(map);
                    const label = document.createElement('span');
                    label.textContent = runid;
                    ctrls.addOverlay(polys[runid], label.innerHTML);
                } catch (error) {
                    console.log(error);
                }
            });

            await Promise.all(tasks);
        }
    }
});
</script>
    <style>
        body {
            padding: 0;
            margin: 0;
        }
        html, body, #map {
            height: 100%;
            width: 100%;
        }
    </style>
  </head>
  <body>
       <div id="map"></div>
    <!-- Placed at the end of the document so the pages load faster -->
    <script type="text/javascript" src="{{ url_for('static', filename='js/spin.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/tinyqueue.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/polylabel.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/underscore.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/colormap.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/geotiff.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/plotty.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/leaflet-spin.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/leaflet-geotiff.js') }}"></script>
  </body>
</html>
