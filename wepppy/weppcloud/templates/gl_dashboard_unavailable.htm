{% extends "base_pure.htm" %}
{% block title %}Roads results unavailable{% endblock %}
{% block body_container %}
<section class="wc-panel" data-error-code="{{ code }}">
  <h1>Roads results unavailable</h1>
  <p>{{ reason }}</p>
  <p><a href="{{ url_for_run('gl_dashboard.gl_dashboard', runid=runid, config=config, output_scope='baseline') }}">Open Baseline dashboard</a></p>
</section>
{% endblock %}
