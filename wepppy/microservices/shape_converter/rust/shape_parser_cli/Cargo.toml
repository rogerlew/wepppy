[package]
name = "shape_parser_cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
encoding_rs = "0.8.35"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shapefile = { version = "0.9.0", features = ["encoding_rs"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
