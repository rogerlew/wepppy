[package]
name = "vector-upload-dependency-probe"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "geoparquet_parser_cli"
path = "src/main.rs"

[dependencies]
parquet = { version = "=60.1.0", default-features = false, features = ["snap"] }
serde_json = "=1.0.145"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
