name: Test isolation (exhaustive)
on:
  workflow_dispatch: null
  schedule:
  - cron: "17 8 * * 6"
jobs:
  test-isolation:
    forest_bootstrap: false
    runs-on:
    - self-hosted
    - Linux
    - X64
    - remote-ci
    timeout-minutes: 360
    env:
      COMPOSE_PROJECT_NAME: wepppy-${{ github.run_id }}-${{ github.run_attempt }}-test-isolation
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        lfs: true
    - name: Verify materialized inputs
      run: |
        git lfs checkout
        git lfs fsck
        python3 tools/verify_lfs_materialized.py --tracked
    - name: Install wctl shim
      env:
        WCTL_SYMLINK_PATH: ${{ github.workspace }}/.wctl/bin/wctl
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/.wctl/bin"
        ./wctl/install.sh dev
        echo "${GITHUB_WORKSPACE}/.wctl/bin" >> "$GITHUB_PATH"
      id: wctl
    - name: Start isolated test runtime
      run: wctl --compose-file docker/docker-compose.test.yml up -d --build --wait
    - name: Build controller assets
      run: wctl --compose-file docker/docker-compose.test.yml exec -T weppcloud
        /opt/venv/bin/python wepppy/weppcloud/controllers_js/build_controllers_js.py
    - name: Initialize disposable account schema
      run: wctl --compose-file docker/docker-compose.test.yml exec -T weppcloud
        /opt/venv/bin/python tests/bootstrap_ci_database.py
    - name: Check baseline suite
      run: wctl --compose-file docker/docker-compose.test.yml run-pytest tests --maxfail=1
    - name: Check pytest isolation
      run: wctl --compose-file docker/docker-compose.test.yml check-test-isolation
        --max-workers 2 --json --log-dir /workdir/wepppy/.pytest_cache/isolation
    - name: Archive isolation diagnostics without following symlinks
      if: always()
      run: |
        if [ -e .pytest_cache ] || [ -L .pytest_cache ]; then
          tar -cf "${RUNNER_TEMP}/test-isolation.tar" -- .pytest_cache
        fi
    - name: Upload isolation diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-isolation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/test-isolation.tar
        if-no-files-found: warn
        retention-days: 7
    - name: Remove isolated test runtime
      if: always() && steps.wctl.outcome == 'success'
      run: wctl --compose-file docker/docker-compose.test.yml down --volumes --remove-orphans --rmi local
permissions:
  contents: read
