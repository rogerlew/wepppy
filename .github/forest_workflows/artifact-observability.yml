name: Artifact Observability
on:
  pull_request:
    paths:
    - AGENTS.md
    - docs/standards/artifact-observability-standard.md
    - docs/prompt_templates/*review_template.md
    - wepppy/nodb/mods/postfire_debris_flow/**
    - wepppy/rq/postfire_debris_flow_rq.py
    - wepppy/microservices/rq_engine/postfire_debris_flow_routes.py
    - wepppy/rq/project_rq_archive.py
    - wepppy/microservices/browse/**
    - tests/nodb/mods/test_postfire_debris_flow*.py
    - tests/microservices/test_rq_engine_postfire_debris_flow.py
    - tests/rq/test_project_rq_archive.py
    - .github/forest_workflows/artifact-observability.yml
    - .github/workflows/artifact-observability.yml
  push:
    branches:
    - master
    paths:
    - AGENTS.md
    - docs/standards/artifact-observability-standard.md
    - docs/prompt_templates/*review_template.md
    - wepppy/nodb/mods/postfire_debris_flow/**
    - wepppy/rq/postfire_debris_flow_rq.py
    - wepppy/microservices/rq_engine/postfire_debris_flow_routes.py
    - wepppy/rq/project_rq_archive.py
    - wepppy/microservices/browse/**
    - tests/nodb/mods/test_postfire_debris_flow*.py
    - tests/microservices/test_rq_engine_postfire_debris_flow.py
    - tests/rq/test_project_rq_archive.py
    - .github/forest_workflows/artifact-observability.yml
    - .github/workflows/artifact-observability.yml
  workflow_dispatch: null
jobs:
  artifact-observability:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - remote-ci
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        lfs: true
        fetch-depth: 0
    - name: Verify materialized inputs
      run: |
        git lfs checkout
        git lfs fsck
        python3 tools/verify_lfs_materialized.py --tracked
    - name: Install wctl shim
      id: wctl
      env:
        WCTL_SYMLINK_PATH: ${{ github.workspace }}/.wctl/bin/wctl
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/.wctl/bin"
        ./wctl/install.sh dev
        echo "${GITHUB_WORKSPACE}/.wctl/bin" >> "$GITHUB_PATH"
    - name: Start isolated test runtime
      run: wctl --compose-file docker/docker-compose.test.yml up -d --build --wait
    - name: Prepare locked CI browser assets
      run: wctl --compose-file docker/docker-compose.test.yml exec -T weppcloud /opt/venv/bin/python
        tests/prepare_ci_runtime.py
    - name: Build controller assets
      run: wctl --compose-file docker/docker-compose.test.yml exec -T weppcloud /opt/venv/bin/python
        wepppy/weppcloud/controllers_js/build_controllers_js.py
    - name: Initialize disposable account schema
      run: wctl --compose-file docker/docker-compose.test.yml exec -T weppcloud /opt/venv/bin/python
        tests/bootstrap_ci_database.py
    - name: Verify artifact writers, failures, migration and archive restore
      run: |
        set -euo pipefail
        wctl --compose-file docker/docker-compose.test.yml run-pytest \
          tests/nodb/mods/test_postfire_debris_flow_observability.py \
          tests/nodb/mods/test_postfire_debris_flow_production.py \
          tests/nodb/mods/test_postfire_debris_flow_publication.py \
          tests/nodb/mods/test_postfire_debris_flow_dnbr.py \
          tests/nodb/mods/test_postfire_debris_flow_soil_thickness.py \
          tests/microservices/test_rq_engine_postfire_debris_flow.py \
          tests/rq/test_project_rq_archive.py
    - name: Remove isolated test runtime
      if: always() && steps.wctl.outcome == 'success'
      run: wctl --compose-file docker/docker-compose.test.yml down --volumes --remove-orphans
        --rmi local
    forest_bootstrap: false
    env:
      COMPOSE_PROJECT_NAME: wepppy-${{ github.run_id }}-${{ github.run_attempt }}-artifact-observability
permissions:
  contents: read
