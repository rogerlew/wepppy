name: Shape-Converter Gates
on:
  pull_request:
    paths:
    - wepppy/microservices/shape_converter/**
    - tests/shape_converter/**
    - docker/docker-compose.dev.yml
    - docker/caddy/Caddyfile
    - tools/check_broad_exceptions.py
    - scripts/build_forest_workflows.py
    - .github/forest_workflows/pytest-shape-converter-gates.yml
    - .github/forest_workflows/bootstrap.yml
    - .github/workflows/pytest-shape-converter-gates.yml
  push:
    branches:
    - master
    paths:
    - wepppy/microservices/shape_converter/**
    - tests/shape_converter/**
    - docker/docker-compose.dev.yml
    - docker/caddy/Caddyfile
    - tools/check_broad_exceptions.py
    - scripts/build_forest_workflows.py
    - .github/forest_workflows/pytest-shape-converter-gates.yml
    - .github/forest_workflows/bootstrap.yml
    - .github/workflows/pytest-shape-converter-gates.yml
  workflow_dispatch: null
jobs:
  pytest-shape-converter-gates:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - remote-ci
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        lfs: true
        fetch-depth: 0
    - name: Verify materialized inputs
      run: |
        git lfs checkout
        git lfs fsck
        python3 tools/verify_lfs_materialized.py --tracked
    - name: Install wctl shim
      id: wctl
      env:
        WCTL_SYMLINK_PATH: ${{ github.workspace }}/.wctl/bin/wctl
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/.wctl/bin"
        ./wctl/install.sh dev
        echo "${GITHUB_WORKSPACE}/.wctl/bin" >> "$GITHUB_PATH"
    - name: Start isolated test runtime
      run: wctl --compose-file docker/docker-compose.test.yml up -d --build --wait
    - name: Build controller assets
      run: wctl --compose-file docker/docker-compose.test.yml exec -T weppcloud /opt/venv/bin/python
        wepppy/weppcloud/controllers_js/build_controllers_js.py
    - name: Initialize disposable account schema
      run: wctl --compose-file docker/docker-compose.test.yml exec -T weppcloud /opt/venv/bin/python
        tests/bootstrap_ci_database.py
    - name: Run shape-converter focused regression sweep
      run: |
        set -euo pipefail
        wctl --compose-file docker/docker-compose.test.yml run-pytest tests/shape_converter/unit -k "archive or inspect or convert or cleanup or abuse or hardening or ui or health or crs or serialization" --maxfail=1
        wctl --compose-file docker/docker-compose.test.yml run-pytest tests/shape_converter/integration -k "inspect or convert or abuse or hardening or ui" --maxfail=1
    - name: Run shape-converter full unit and integration gates
      run: |
        set -euo pipefail
        wctl --compose-file docker/docker-compose.test.yml run-pytest tests/shape_converter/unit
        wctl --compose-file docker/docker-compose.test.yml run-pytest tests/shape_converter/integration
    - name: Run broad exception changed-file enforcement
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.base_ref }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        BASE_REF=""
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="${PR_BASE_SHA:-}"
        elif [ "${{ github.event_name }}" = "push" ]; then
          BASE_REF="${PUSH_BEFORE_SHA:-}"
        fi
        if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
          BASE_REF="origin/master"
        fi

        if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${PR_BASE_REF:-}" ]; then
          git fetch --no-tags --prune origin "${PR_BASE_REF}" || true
        else
          git fetch --no-tags --prune origin master || true
        fi

        if ! git rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${PR_BASE_REF:-}" ]; then
            BASE_REF="origin/${PR_BASE_REF}"
          else
            BASE_REF="origin/master"
          fi
        fi

        python3 tools/check_broad_exceptions.py --enforce-changed --base-ref "${BASE_REF}"
    - name: Verify generated forest workflows are in sync
      run: |
        set -euo pipefail
        scripts/build_forest_workflows.py --check
    - name: Remove isolated test runtime
      if: always() && steps.wctl.outcome == 'success'
      run: wctl --compose-file docker/docker-compose.test.yml down --volumes --remove-orphans
        --rmi local
    forest_bootstrap: false
    env:
      COMPOSE_PROJECT_NAME: wepppy-${{ github.run_id }}-${{ github.run_attempt }}-pytest-shape-converter-gates
permissions:
  contents: read
