name: Integration Policy
on:
  pull_request_target:
    branches: [master, 'governance-canary/**']
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  trusted-policy:
    forest_bootstrap: false
    name: Evaluate base-owned integration policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      INTEGRATION_POLICY_APPROVAL: ${{ vars.INTEGRATION_POLICY_APPROVAL }}
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read candidate Git objects without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "${CANDIDATE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          python3 tools/check_security_baseline.py policy --base "${BASE_SHA}" --candidate "${CANDIDATE_SHA}"
  report-policy:
    forest_bootstrap: false
    name: Report trusted policy on exact PR head
    needs: trusted-policy
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Publish the exact-head policy result
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_RESULT: ${{ needs.trusted-policy.result }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.request
          candidate = os.environ["CANDIDATE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", candidate):
              raise SystemExit("Invalid candidate SHA")
          conclusion = "success" if os.environ["POLICY_RESULT"] == "success" else "failure"
          repository = os.environ["GITHUB_REPOSITORY"]
          details = f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          data = json.dumps({"name": "integration-governance-policy", "head_sha": candidate,
                             "status": "completed", "conclusion": conclusion,
                             "details_url": details,
                             "output": {"title": "Trusted integration policy",
                                        "summary": f"Base-owned policy result: {conclusion}. Candidate code was not executed."}}).encode()
          request = urllib.request.Request(f"https://api.github.com/repos/{repository}/check-runs",
              data=data, method="POST", headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if result.get("head_sha") != candidate or result.get("conclusion") != conclusion:
              raise SystemExit("Check result readback mismatch")
          if conclusion != "success":
              raise SystemExit("Trusted policy rejected the candidate")
