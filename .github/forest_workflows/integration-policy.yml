name: Integration Policy
on:
  pull_request_target:
    branches: [master, 'governance-canary/**']
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  trusted-policy:
    forest_bootstrap: false
    name: Evaluate base-owned integration policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      INTEGRATION_POLICY_APPROVAL: ${{ vars.INTEGRATION_POLICY_APPROVAL }}
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read candidate Git objects without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "${CANDIDATE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          python3 tools/check_security_baseline.py policy --base "${BASE_SHA}" --candidate "${CANDIDATE_SHA}"
  report-policy:
    forest_bootstrap: false
    name: integration-governance-policy
    needs: trusted-policy
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful trusted policy evaluation
        env:
          POLICY_RESULT: ${{ needs.trusted-policy.result }}
        shell: bash
        run: |
          if [[ "${POLICY_RESULT}" != "success" ]]; then
            echo "Trusted policy did not succeed: ${POLICY_RESULT}" >&2
            exit 1
          fi
