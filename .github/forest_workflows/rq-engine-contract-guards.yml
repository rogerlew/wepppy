name: RQ-Engine Contract Guards
on:
  pull_request:
    paths:
      - wepppy/microservices/rq_engine/**
      - tests/microservices/test_rq_engine_openapi_contract.py
      - tests/tools/test_endpoint_inventory_guard.py
      - tests/tools/test_route_contract_checklist_guard.py
      - tools/check_endpoint_inventory.py
      - tools/check_route_contract_checklist.py
      - tools/wctl2/commands/python_tasks.py
      - tools/wctl2/tests/test_python_tasks_commands.py
      - docs/schemas/rq-engine-endpoint-inventory.md
      - docs/work-packages/20260208_rq_engine_agent_usability/artifacts/route_contract_checklist_20260208.md
      - .github/forest_workflows/rq-engine-contract-guards.yml
      - .github/workflows/rq-engine-contract-guards.yml
  push:
    branches:
      - master
    paths:
      - wepppy/microservices/rq_engine/**
      - tests/microservices/test_rq_engine_openapi_contract.py
      - tests/tools/test_endpoint_inventory_guard.py
      - tests/tools/test_route_contract_checklist_guard.py
      - tools/check_endpoint_inventory.py
      - tools/check_route_contract_checklist.py
      - tools/wctl2/commands/python_tasks.py
      - tools/wctl2/tests/test_python_tasks_commands.py
      - docs/schemas/rq-engine-endpoint-inventory.md
      - docs/work-packages/20260208_rq_engine_agent_usability/artifacts/route_contract_checklist_20260208.md
      - .github/forest_workflows/rq-engine-contract-guards.yml
      - .github/workflows/rq-engine-contract-guards.yml
  workflow_dispatch:
jobs:
  rq-engine-contract-guards:
    forest_bootstrap: false
    runs-on:
      - self-hosted
      - Linux
      - X64
      - remote-ci
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: wepppy-${{ github.run_id }}-${{ github.run_attempt }}-rq-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - name: Verify materialized inputs
        run: |
          git lfs checkout
          git lfs fsck
          python3 tools/verify_lfs_materialized.py --tracked
      - name: Install wctl shim
        id: wctl
        env:
          WCTL_SYMLINK_PATH: ${{ github.workspace }}/.wctl/bin/wctl
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.wctl/bin"
          ./wctl/install.sh dev
          echo "${GITHUB_WORKSPACE}/.wctl/bin" >> "$GITHUB_PATH"
      - name: Start isolated test runtime
        run: wctl --compose-file docker/docker-compose.test.yml up -d --build --wait
      - name: Run rq-engine contract guard scripts
        run: wctl --compose-file docker/docker-compose.test.yml check-rq-contracts
      - name: Run rq-engine contract guard tests
        run: |
          wctl --compose-file docker/docker-compose.test.yml run-pytest \
            tests/tools/test_endpoint_inventory_guard.py \
            tests/tools/test_route_contract_checklist_guard.py \
            tests/microservices/test_rq_engine_openapi_contract.py
      - name: Remove isolated test runtime
        if: always() && steps.wctl.outcome == 'success'
        run: wctl --compose-file docker/docker-compose.test.yml down --volumes --remove-orphans --rmi local
permissions:
  contents: read
