name: NPM Tests
on:
  pull_request:
    paths:
    - wepppy/weppcloud/static-src/**
    - wepppy/weppcloud/controllers_js/**
    - package.json
    - package-lock.json
    - .github/forest_workflows/npm-tests.yml
    - .github/workflows/npm-tests.yml
  push:
    branches:
    - master
    paths:
    - wepppy/weppcloud/static-src/**
    - wepppy/weppcloud/controllers_js/**
    - package.json
    - package-lock.json
    - .github/forest_workflows/npm-tests.yml
    - .github/workflows/npm-tests.yml
  workflow_dispatch: null
jobs:
  npm-tests:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - remote-ci
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Run JavaScript checks
      run: |-
        set -euo pipefail
        docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
          -e HOME=/tmp -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/wepppy/weppcloud/static-src \
          node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0 sh -ec 'npm ci --legacy-peer-deps
        npm run lint
        npm test'
    forest_bootstrap: false
permissions:
  contents: read
