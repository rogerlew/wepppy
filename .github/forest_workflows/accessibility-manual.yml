name: Accessibility Nightly
on:
  workflow_dispatch: null
  schedule:
  - cron: 0 6 * * *
  - cron: 0 7 * * *
jobs:
  accessibility-nightly:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - remote-ci
    timeout-minutes: 75
    env:
      COMPOSE_PROJECT_NAME: wepppy-${{ github.run_id }}-${{ github.run_attempt }}-accessibility-manual
    steps:
    - name: Determine Pacific run window
      id: pacific_window
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" != "schedule" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Manual dispatch detected; running full workflow."
          exit 0
        fi
        pacific_time="$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
        pacific_hour="$(TZ=America/Los_Angeles date '+%H')"
        echo "Pacific time at trigger: ${pacific_time}"
        if [ "${pacific_hour}" = "23" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Scheduled run is within 11 PM Pacific window."
        else
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "Scheduled run is outside 11 PM Pacific window; skipping."
        fi
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        lfs: true
        fetch-depth: 0
      if: (success()) && steps.pacific_window.outputs.should_run == 'true'
    - name: Verify materialized inputs
      run: |
        git lfs checkout
        git lfs fsck
        python3 tools/verify_lfs_materialized.py --tracked
      if: (success()) && steps.pacific_window.outputs.should_run == 'true'
    - name: Install wctl shim
      id: wctl
      env:
        WCTL_SYMLINK_PATH: ${{ github.workspace }}/.wctl/bin/wctl
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/.wctl/bin"
        ./wctl/install.sh dev
        echo "${GITHUB_WORKSPACE}/.wctl/bin" >> "$GITHUB_PATH"
      if: (success()) && steps.pacific_window.outputs.should_run == 'true'
    - name: Start isolated test runtime
      run: wctl --compose-file docker/docker-compose.browser-test.yml up -d --build
        --wait
      if: (success()) && steps.pacific_window.outputs.should_run == 'true'
    - name: Prepare locked CI browser assets
      run: wctl --compose-file docker/docker-compose.browser-test.yml exec -T weppcloud
        /opt/venv/bin/python tests/prepare_ci_runtime.py
      if: (success()) && steps.pacific_window.outputs.should_run == 'true'
    - name: Build controller assets
      run: wctl --compose-file docker/docker-compose.browser-test.yml exec -T weppcloud
        /opt/venv/bin/python wepppy/weppcloud/controllers_js/build_controllers_js.py
      if: (success()) && steps.pacific_window.outputs.should_run == 'true'
    - name: Run isolated browser checks
      run: wctl --compose-file docker/docker-compose.browser-test.yml exec -T weppcloud
        /opt/venv/bin/python tests/ci_browser_runtime.py accessibility
      if: (success()) && steps.pacific_window.outputs.should_run == 'true'
    - name: Upload browser reports
      if: (always()) && steps.pacific_window.outputs.should_run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-manual
        path: |-
          wepppy/weppcloud/static-src/test-results/
          wepppy/weppcloud/static-src/playwright-report/
        if-no-files-found: error
    - name: Remove isolated test runtime
      if: (always() && steps.wctl.outcome == 'success') && steps.pacific_window.outputs.should_run
        == 'true'
      run: wctl --compose-file docker/docker-compose.browser-test.yml down --volumes
        --remove-orphans --rmi local
    forest_bootstrap: false
permissions:
  contents: read
