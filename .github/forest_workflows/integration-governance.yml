name: Integration Governance
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  integration-governance:
    forest_bootstrap: false
    name: integration-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BASE_SHA: ${{ github.event.before }}
      BOOTSTRAP_CHECKER_SHA256: ${{ vars.INTEGRATION_GOVERNANCE_BOOTSTRAP_SHA256 }}
      INTEGRATION_POLICY_APPROVAL: ${{ vars.INTEGRATION_POLICY_APPROVAL }}
    steps:
      - name: Check out exact candidate without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load checker from trusted prior revision
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request) base="${PR_BASE_SHA}" ;;
            push) base="${PUSH_BASE_SHA}" ;;
            workflow_dispatch) base="$(git rev-parse HEAD^)" ;;
            *) exit 1 ;;
          esac
          [[ "${base}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${base}" "${CANDIDATE_SHA}"
          checker="${RUNNER_TEMP}/trusted-integration-checker.py"
          if git cat-file -e "${base}:tools/check_security_baseline.py" 2>/dev/null; then
            git show "${base}:tools/check_security_baseline.py" > "${checker}"
          else
            test "${base}" = 420e31b97e962dd6ea79694efe89f348c27ef83f
            [[ "${BOOTSTRAP_CHECKER_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            git show "${CANDIDATE_SHA}:tools/check_security_baseline.py" > "${checker}"
            printf '%s  %s\n' "${BOOTSTRAP_CHECKER_SHA256}" "${checker}" | sha256sum --check --status
          fi
          echo "TRUSTED_CHECKER=${checker}" >> "${GITHUB_ENV}"
          echo "TRUSTED_BASE=${base}" >> "${GITHUB_ENV}"
      - name: Verify accepted policy against exact candidate
        run: |
          set -euo pipefail
          python3 "${TRUSTED_CHECKER}" policy --base "${TRUSTED_BASE}" --candidate "${CANDIDATE_SHA}"
      - name: Build candidate Rust parser with locked dependencies
        run: cargo build --release --locked --manifest-path wepppy/microservices/shape_converter/rust/shape_parser_cli/Cargo.toml
      - name: Exercise retained parser output and rejection contract
        run: |
          python3 "${TRUSTED_CHECKER}" smoke --binary wepppy/microservices/shape_converter/rust/shape_parser_cli/target/release/shape_parser_cli
