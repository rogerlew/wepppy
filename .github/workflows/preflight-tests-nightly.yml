# WARNING: This file is generated by scripts/build_forest_workflows.py. Do NOT edit directly.
name: Preflight Tests Nightly
on:
  schedule:
  - cron: 35 10 * * *
  workflow_dispatch: null
jobs:
  preflight-tests:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - remote-ci
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Run service unit and integration tests
      run: |-
        set -euo pipefail
        mkdir -p telemetry
        docker run --rm --cap-drop ALL --security-opt no-new-privileges \
          -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace/services/preflight2 \
          golang:1.25-alpine@sha256:3eb6c2b3db8d55e38537302edb510b4417f8a115efbd5906d131ceba9468e29a go test -mod=readonly -tags=integration ./... 2>&1 | tee telemetry/preflight2-tests.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: preflight2-tests
        path: telemetry/preflight2-tests.log
        if-no-files-found: error
permissions:
  contents: read
