# WARNING: This file is generated by scripts/build_forest_workflows.py. Do NOT edit directly.
name: Status2 Smoke
on:
  schedule:
  - cron: 0 9 * * *
  workflow_dispatch: null
jobs:
  status2-smoke:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - remote-ci
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install wctl shim
      id: wctl
      env:
        WCTL_SYMLINK_PATH: ${{ github.workspace }}/.wctl/bin/wctl
      run: |-
        mkdir -p "${GITHUB_WORKSPACE}/.wctl/bin"
        ./wctl/install.sh dev
        echo "${GITHUB_WORKSPACE}/.wctl/bin" >> "$GITHUB_PATH"
    - name: Run authenticated Status2 smoke
      run: |-
        set -euo pipefail
        mkdir -p telemetry
        wctl --compose-file docker/docker-compose.status-smoke-test.yml up --build --abort-on-container-exit --exit-code-from smoke 2>&1 | tee telemetry/status2-smoke.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: status2-smoke-log
        path: telemetry/status2-smoke.log
        if-no-files-found: error
    - name: Remove isolated smoke runtime
      if: always() && steps.wctl.outcome == 'success'
      run: wctl --compose-file docker/docker-compose.status-smoke-test.yml down --volumes
        --remove-orphans --rmi local
    env:
      COMPOSE_PROJECT_NAME: wepppy-${{ github.run_id }}-${{ github.run_attempt }}-status-smoke
permissions:
  contents: read
