# Isolated CI runtime; no Forest mounts, host credentials, or published ports.
services:
  weppcloud:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["/bin/sleep", "infinity"]
    working_dir: /workdir/wepppy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONPATH: /workdir/wepppy
      HOME: /tmp
      SITE_PREFIX: /weppcloud
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_USER: wepppy
      POSTGRES_DB: wepppy
      POSTGRES_PASSWORD: local-ci-only
      SECRET_KEY: local-ci-only
      SECURITY_PASSWORD_SALT: local-ci-only
      WEPPCLOUD_RQ_LIFECYCLE_LOCK_DIR: /tmp/rq-lifecycle-locks
    volumes:
      - ..:/workdir/wepppy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wepppy
      POSTGRES_DB: wepppy
      POSTGRES_PASSWORD: local-ci-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wepppy -d wepppy"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
networks:
  default:
    internal: true
