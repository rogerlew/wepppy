x-wepppyo3-interchange-entrypoint: &wepppyo3-interchange-entrypoint
  - /opt/venv/bin/python
  - /workdir/wepppy/docker/wepppyo3-interchange-preflight.py
  - --

services:
  rq-worker-fork-archive:
    image: ${WEPPCLOUD_IMAGE:-wepppy:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_USER: roger
        APP_GROUP: docker
        APP_UID: "1002"
        APP_GID: "130"
    # Production run storage is owned by numeric identity 1002:130 on the
    # shared NFS volume.  Host-local user/group names on wepp3 use different
    # ids, so keep this service pinned to the storage identity.
    user: "1002:130"
    init: true
    restart: unless-stopped
    # RQ treats SIGTERM as a warm shutdown: stop dequeuing, then let the active
    # job finish. Match the longest fork/archive job timeout before SIGKILL.
    stop_grace_period: 216000s
    working_dir: /workdir/wepppy
    env_file:
      - ${WEPPPY_ENV_FILE:-defaults.env}
    entrypoint: *wepppyo3-interchange-entrypoint
    secrets:
      - redis_password
      - source: discord_bot_token
        target: /opt/vendor/weppcloud2/weppcloud2/discord_bot/.bot_token
    environment:
      PYTHONUNBUFFERED: "1"
      MPLCONFIGDIR: /tmp/matplotlib
      RQ_REDIS_URL: ${RQ_REDIS_URL:?Set RQ_REDIS_URL to production Redis DB 9}
      REDIS_URL: ${RQ_REDIS_URL:?Set RQ_REDIS_URL to production Redis DB 9}
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      WC1_DIR: /wc1
      GEODATA_DIR: /geodata
      WEPPPY_PROJECT_CONFIG_READER_ENABLED: ${WEPPPY_PROJECT_CONFIG_READER_ENABLED:-false}
      WEPPPY_PROJECT_CONFIG_PRESET_WRITER_ENABLED: ${WEPPPY_PROJECT_CONFIG_PRESET_WRITER_ENABLED:-false}
      WEPPPY_PROJECT_CONFIG_BUILDER_WRITER_ENABLED: ${WEPPPY_PROJECT_CONFIG_BUILDER_WRITER_ENABLED:-false}
      WEPPPY_PROJECT_CONFIG_UPDATE_ENABLED: ${WEPPPY_PROJECT_CONFIG_UPDATE_ENABLED:-false}
      LOGLEVEL: INFO
      RQ_LOGGING_LEVEL: INFO
      RQ_REDIS_WAIT_TIMEOUT_SECONDS: ${RQ_REDIS_WAIT_TIMEOUT_SECONDS:-300}
      RQ_REDIS_WAIT_INTERVAL_SECONDS: ${RQ_REDIS_WAIT_INTERVAL_SECONDS:-1}
    volumes:
      - /geodata/wc1:/wc1
      - /geodata:/geodata:ro
    command:
      - bash
      - -lc
      - |
        exec /workdir/wepppy/docker/rq-worker-startup.sh 1 fork-archive

secrets:
  redis_password:
    file: ./secrets/redis_password
  # Preserve the production worker import contract even when notifications are
  # disabled; weppcloud2 reads this fixed path while its module is imported.
  discord_bot_token:
    file: ${DISCORD_BOT_TOKEN_FILE:-/dev/null}
