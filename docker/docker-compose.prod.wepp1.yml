x-wepp1-volumes: &wepp1-volumes
  - /geodata/wc1:/wc1
  - /geodata:/geodata

x-wepppy-env: &wepppy-env
  GL_DASHBOARD_BATCH_ENABLED: ${GL_DASHBOARD_BATCH_ENABLED:-false}
  WEPPPY_SOURCE_ROOT: ${WEPPPY_SOURCE_ROOT:-/workdir/wepppy}

# This override does not define a `redis` service.
# Redis durability knobs are wired in docker-compose.prod.yml and apply there.
x-redis-durability-env: &redis-durability-env
  REDIS_APPENDONLY: ${REDIS_APPENDONLY:-yes}
  REDIS_APPENDFSYNC: ${REDIS_APPENDFSYNC:-everysec}
  REDIS_SAVE_SCHEDULE: ${REDIS_SAVE_SCHEDULE:-900 1 300 10 60 10000}
  REDIS_AOF_USE_RDB_PREAMBLE: ${REDIS_AOF_USE_RDB_PREAMBLE:-yes}

x-wepppy-image: &wepppy-image
  image: ${WEPPCLOUD_IMAGE:-wepppy:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      APP_USER: roger
      APP_GROUP: docker
      APP_UID: "1002"
      APP_GID: "130"
  environment:
    <<: *wepppy-env

services:
  soil-db:
    profiles: [soil-data]
    image: postgis/postgis:17-3.7@sha256:b2379049e1d7623127ec61ba802a44706109bf91c23ec76b8f323888fd037ed9
    environment:
      POSTGRES_DB: soil
      POSTGRES_USER: soil_import
      POSTGRES_PASSWORD_FILE: /run/secrets/soil_import_password
      SOIL_SERVE_PASSWORD_FILE: /run/secrets/soil_serve_password
    secrets: [soil_import_password, soil_serve_password]
    volumes:
      - soil-tabular-data:/var/lib/postgresql/data
      - ${SOIL_BOOTSTRAP_SQL:-/dev/null}:/docker-entrypoint-initdb.d/30-national.sql:ro
      - ${SOIL_DATA_SOURCE_DIR:-../../soil-data-access}/docker/init.sh:/docker-entrypoint-initdb.d/20-soil.sh:ro
      - ${SOIL_DATA_SOURCE_DIR:-../../soil-data-access}/migrations/001_replay.sql:/opt/soil/001_replay.sql:ro
    networks: [soil-database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U soil_import -d soil']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30m
    restart: unless-stopped
    shm_size: 128mb

  soil-api:
    profiles: [soil-data]
    image: ${SOIL_API_IMAGE:-wepppy-soil-data:local}
    build:
      context: ${SOIL_DATA_SOURCE_DIR:-../../soil-data-access}
    environment:
      DATABASE_URL_FILE: /run/secrets/soil_database_url
      CODE_REVISION: ${SOIL_CODE_REVISION:-unset}
      SOIL_DATA_RELEASE: ${SOIL_DATA_RELEASE:-}
    secrets: [soil_database_url]
    networks: [soil-database, backend]
    ports:
      - "${SOIL_API_BIND_IP:-127.0.0.1}:18080:8080"
    depends_on:
      soil-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/soil-data-access, --healthcheck]
      interval: 10s
      timeout: 4s
      retries: 3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m

  # Production fork/archive work is consumed only by the wepp3 stack.
  rq-worker-fork-archive:
    scale: 0
  rq-worker-query-catalog:
    scale: 0
  fcgiwrap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.fcgiwrap
      args:
        BASE_IMAGE: ${WEPPCLOUD_IMAGE:-wepppy:latest}
    image: wepppy-fcgiwrap
    volumes:
      - /geodata/wc1:/wc1
      - /geodata:/geodata

  caddy:
    # Reduce CVE-2026-98432 exposure; host kernel patching is still required.
    sysctls:
      net.mptcp.enabled: "0"
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /workdir/wepppy/docker/caddy/Caddyfile.wepp1:/etc/caddy/Caddyfile:ro
      - ../wepppy/weppcloud/static:/srv/weppcloud/static:ro
      - ../wepppy/weppcloud/routes/usersum/static:/srv/usersum/static:ro
      - /geodata:/geodata:ro
      - caddy-data:/data
      - caddy-config:/config
  cap:
    image: ${CAP_IMAGE:-wepppy-cap:latest}
    environment:
      CAP_ASSET_ROOT: /opt/cap
  weppcloud:
    <<: *wepppy-image
    volumes:
      - /geodata/wc1:/wc1
      - /geodata:/geodata
      - ../wepppy/weppcloud/static:/srv/weppcloud/static
    command:
      - gunicorn
      - --workers
      - "10"
      - --threads
      - "4"
      - --timeout
      - "1800"
      - --bind
      - 0.0.0.0:8000
      - --log-level
      - info
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "200"
      - wepppy.weppcloud.app:app
  browse:
    <<: *wepppy-image
    volumes: *wepp1-volumes
    command:
      - gunicorn
      - --timeout
      - "120"
      - --workers
      - "8"
      - --bind
      - 0.0.0.0:9009
      - --log-level
      - info
      - -k
      - uvicorn.workers.UvicornWorker
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "200"
      - wepppy.microservices.browse:app
  download:
    <<: *wepppy-image
    volumes: *wepp1-volumes
    command:
      - gunicorn
      - --workers
      - "4"
      - --bind
      - 0.0.0.0:9011
      - --log-level
      - info
      - -k
      - uvicorn.workers.UvicornWorker
      - --timeout
      - "1800"
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "200"
      - wepppy.microservices.download:app
  dtale:
    <<: *wepppy-image
    volumes: *wepp1-volumes
  profile-playback:
    <<: *wepppy-image
    volumes:
      - /geodata/wc1:/wc1
      - /geodata:/geodata
      - ${PROFILE_PLAYBACK_DATA_DIR:-/workdir/wepppy-test-engine-data}:/workdir/wepppy-test-engine-data
  elevationquery:
    <<: *wepppy-image
    volumes: *wepp1-volumes
  metquery:
    <<: *wepppy-image
    volumes: *wepp1-volumes
  wmesque:
    <<: *wepppy-image
    volumes: *wepp1-volumes
  wmesque2:
    <<: *wepppy-image
    volumes: *wepp1-volumes
  query-engine:
    <<: *wepppy-image
    volumes: *wepp1-volumes
  shape-converter:
    image: ${SHAPE_CONVERTER_IMAGE:-wepppy-shape-converter:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.shape-converter
  rq-engine:
    <<: *wepppy-image
    volumes: *wepp1-volumes
    environment:
      <<: *wepppy-env
      RQ_ENGINE_POLL_RATE_LIMIT_COUNT: "1200"
      RQ_ENGINE_POLL_RATE_LIMIT_WINDOW_SECONDS: "60"
  rq-worker:
    <<: *wepppy-image
    cpuset: "0-31"
    volumes:
      - /geodata/wc1:/wc1
      - /geodata:/geodata
      - /var/run/docker.sock:/var/run/docker.sock
  rq-worker-batch:
    <<: *wepppy-image
    cpuset: "0-31"
    volumes:
      - /geodata/wc1:/wc1
      - /geodata:/geodata
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *wepppy-env
      PERIDOT_CPU: "4"
  scheduler:
    <<: *wepppy-image
    volumes: *wepp1-volumes
    environment:
      <<: *wepppy-env
      SCHEDULE_CONFIG: /workdir/wepppy/docker/scheduled-tasks.yml
      SCHEDULE_SLEEP_SECONDS: "30"
      SCHEDULE_LOG_LEVEL: INFO
    command:
      - python
      - -m
      - wepppy.tools.scheduler
  weppcloudr:
    image: ${WEPPCLOUDR_IMAGE:-weppcloudr:latest}
    container_name: weppcloudr
    volumes:
      - /geodata:/geodata
      - /geodata/wc1:/wc1
      - weppcloudr-renv-cache:/opt/weppcloudr/renv/cache

networks:
  soil-database:
    internal: true

volumes:
  soil-tabular-data:
  caddy-data:
  caddy-config:
  weppcloudr-renv-cache:

secrets:
  soil_import_password:
    file: ./secrets/soil_import_password
  soil_serve_password:
    file: ./secrets/soil_serve_password
  soil_database_url:
    file: ./secrets/soil_database_url
  discord_bot_token:
    file: /workdir/weppcloud2/weppcloud2/discord_bot/.bot_token
